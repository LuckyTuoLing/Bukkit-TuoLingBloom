#拓灵绽放 消息配置文件
#占位符说明:
# %preset%     - 预设名
# %view%       - 动画名
# %entry%      - 世界贴图名
# %cooldown%   - 冷却剩余秒数
# %require%    - 需要的数量
# %actual%     - 实际的数量
# %value%      - 配置的value值
# %mode%       - 策略模式
# %type%       - 类型(texture/model)
# %index%      - 层级索引
# %name%       - 名称
# %key%        - 配置键
# %error%      - 错误信息
# %version%    - 版本号

