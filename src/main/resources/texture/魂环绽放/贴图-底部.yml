

setting:
  1:
    delay: 0 #0秒后播放第一个
    texture:
      translate-x: 0
      translate-y: 2.35
      translate-z: 0.0
      rotate-x: 90
      rotate-y: -60
      rotate-z: 0
      path: "hh/h1.png" #默认贴图,检测不到时使用
      follow-player-eyes: false #贴图是否始终面向观察者视角
    animations:
      translate-animation:
        direction: 'z'
        delay: 0
        distance: 2.30 #2.35-0.05
        duration: 3000
        cycle-count: 1
        fixed: true
      scale-animation:
        delay: 0
        from-scale: 10.3
        to-scale: 1.5
        duration: 3000
        cycle-count: 1
        fixed: true
        resetTime: 0
      rotate-animation:
        direction: 'z'
        delay: 0
        angle: 360.0
        duration: 6000
        cycle-count: -1
        fixed: false
